# myfood-cloudless — Home Assistant example configuration.
#
# 1. Copy myfood_cloudless/reader.py to Home Assistant, e.g. /config/scripts/reader.py
# 2. Make sure HA can reach the controller on your LAN. If HA resolves the device
#    name, use --host myfoodpi. Otherwise connect by IP and pass the device name as
#    the Host header: --host 192.168.8.221 --vhost myfoodpi
# 3. Add the blocks below to configuration.yaml and restart HA.
#
# Cadence note: the controller samples ~every 30 minutes. Polling every 60 s gives
# low latency; HA's recorder only stores a row when a value actually changes, so
# identical polls between samples are not written (~1 row per 30-min sample).

command_line:
  - sensor:
      name: myfood_greenhouse
      command: "python3 /config/scripts/reader.py --host myfoodpi"
      command_timeout: 30
      scan_interval: 60
      value_template: "{{ value_json.last_sample | default(value_json.ts) }}"
      json_attributes:
        - ph
        - water_temp
        - air_temp
        - humidity
        - last_sample

template:
  - sensor:
      - name: "Greenhouse pH"
        state: "{{ state_attr('sensor.myfood_greenhouse','ph') }}"
        unit_of_measurement: "pH"
        state_class: measurement
      - name: "Greenhouse Water Temperature"
        state: "{{ state_attr('sensor.myfood_greenhouse','water_temp') }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
      - name: "Greenhouse Air Temperature"
        state: "{{ state_attr('sensor.myfood_greenhouse','air_temp') }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
      - name: "Greenhouse Humidity"
        state: "{{ state_attr('sensor.myfood_greenhouse','humidity') }}"
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
